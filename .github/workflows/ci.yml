name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read pnpm version from packageManager
        id: pnpm-version
        run: echo "version=$(node -p "require('./package.json').packageManager.split('@')[1]")" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Next.js 16 no longer runs ESLint as part of `next build`, so without
      # this step nothing would catch a lint regression on the way to main.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Catches a schema change committed without its migration, which would
      # otherwise reach production and fail there -- or, worse, not fail and
      # leave the two environments divergent. `generate` reads only the schema
      # and the committed journal, so this needs no database.
      - name: Check migrations are in sync with the schema
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Schema changed without a matching migration. Run 'pnpm db:generate' and commit the result."
            git --no-pager diff --stat drizzle
            exit 1
          fi

      - name: Build
        run: pnpm build
        env:
          # The build must not depend on a real database connection, and it does
          # not make one: `src/server/db/index.ts` reads this at module scope to
          # construct the client, and no route runs during the build because
          # every route here is dynamic. What it does need is a *well-formed*
          # string, since an absent one throws "DATABASE_URL is missing" while
          # collecting page data.
          #
          # So a placeholder is the default and a secret is the override. With
          # no secret configured -- an unset `${{ secrets.X }}` expands to an
          # empty string, not to nothing -- the empty value is what reached the
          # build before, which is why this step failed on the first run.
          #
          # The placeholder is deliberately unroutable. It must never be a real
          # credential, and it must never point at the production database.
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://build:build@127.0.0.1:5432/build' }}
          # Never used to sign anything during a build; present because
          # next-auth reads it at module scope too.
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'build-only-not-a-real-secret' }}
