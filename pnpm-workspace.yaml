# Dependency install scripts that are allowed to run.
#
# pnpm writes "set this to true or false" placeholders here when it cannot
# prompt (CI, non-interactive shells). Those placeholders are invalid values and
# make every install fail, so each one is resolved below.
#
# Not listed => the package's install script is skipped.
#   sharp           - only needed for next/image optimization; Vercel provides it.
#   unrs-resolver  - ships a JS fallback, so skipping the native build is fine.
allowBuilds:
  bufferutil: true
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: set this to true or false
